# Miracast-friendly defaults (X11): render through the compositor so the
# screen-cast captures the video instead of showing black.
vo=gpu
hwdec=auto-copy
# Open maximized rather than true-fullscreen. True fullscreen makes GNOME
# "unredirect" the window (bypassing the compositor), which the cast reads
# as black. Maximized fills the screen but stays capturable.
window-maximized=yes

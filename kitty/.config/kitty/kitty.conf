# vim:ft=kitty

mouse_map click url launch

# Keep click-drag selection local even when tmux has grabbed the mouse (mouse on),
# so the wheel scrolls tmux but select + middle-click-paste stay native (no Shift).
mouse_map left press ungrabbed,grabbed mouse_selection normal
mouse_map left doublepress ungrabbed,grabbed mouse_selection word
mouse_map left triplepress ungrabbed,grabbed mouse_selection line
# Middle click: if this window is ssh'd somewhere and the clipboard holds an
# image, sshpaste uploads it and types the remote path (see ctrl+alt+v);
# otherwise sshpaste -p falls back to the normal paste_from_selection.
mouse_map middle release ungrabbed,grabbed launch --type=background --copy-env sshpaste -p

allow_remote_control yes
listen_on unix:/tmp/kitty-ada
# Terminals live in tmux on cumin (see shell= below), which survives laptop
# reboots; at startup, kitty/startup.session runs cumin-reopen to put one tab
# back on each session nobody is looking at (since 2026-11-03). The old local
# save/resume scripts in ~/dev/kitty-session stay but are dormant.
startup_session startup.session

# Drop the two shell-integration bits that emit bare OSC bytes (no trailing
# newline) into the stream — the OSC 133 prompt mark and the OSC 7 cwd
# report. They race the parallel-startup ordering of precmd hooks during
# session restore and trip zsh's PROMPT_SP into padding. Clone-shell and
# sudo env passthrough still work.
# Terminals drop into a fresh tmux session on cumin (see kitty-session/bin/cumin-shell);
# falls back to a local zsh if cumin is unreachable. New local shell: ctrl+shift+l.
shell /home/ada/dev/kitty-session/bin/cumin-shell
shell_integration enabled no-prompt-mark no-cwd

map ctrl+alt+f toggle_fullscreen
# Paste the clipboard image into the Claude Code prompt running over ssh in
# this window (uploads it, then types the remote path into the tmux pane).
# --copy-env hands sshpaste this window's KITTY_* vars so it can see which
# host the window is ssh'd to.
map ctrl+alt+v launch --type=background --copy-env sshpaste
map f11 toggle_maximized
# start a new LOCAL (lavender) shell, not the cumin session
map ctrl+shift+' launch --cwd=~ zsh
# new LOCAL (lavender) TAB — overrides kitty's default next_layout on this key
map ctrl+shift+l launch --type=tab --cwd=~ zsh
# Close the window locally — always works, even when cumin is unreachable.
# Closing DETACHES the cumin session (it keeps running); kill sessions explicitly
# with `tk`, or tmux prefix(Ctrl-a)+K from inside one.
map ctrl+shift+w close_window

enabled_layouts tall:bias=50,*
# Split: a new cumin session in the current directory of THIS window's session
# (where its claude was launched, say). ctrl+t / a new OS window run plain
# cumin-shell and start at ~/dev.
map kitty_mod+enter launch /home/ada/dev/kitty-session/bin/cumin-shell --like @active-kitty-window-id
font_size 13.5

# DejaVu Nerd line-gap fix — uncomment when DejaVu Nerd is the active font.
# Restores the ~3.6% line gap the Nerd Fonts patcher zeros out of DejaVu's
# OS/2 typoLineGap (was 410, patched to 0).
# modify_font cell_height 103%

# Route Nerd Font icon codepoints (PUA + a couple of non-PUA strays) to a
# dedicated icons-only font, regardless of what font_family is set to.
# Lets you use a non-Nerd font (e.g. Berkeley Mono) as primary and still get
# all the   icons. No font patching, no licensing question.
symbol_map U+23FB-U+23FE,U+2B58,U+E000-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono

# live font picker — cycles through installed fonts with preview
map kitty_mod+alt+f launch --type=overlay kitten choose-fonts

# ctrl+f: search the scrollback, browser-style (see kitty-find).
# cumin tmux window: tmux copy-mode incremental search (Enter, n/N, Esc).
# local window: kitty's scrollback in less (? searches up, n/N, q).
# Note this steals ctrl+f (page forward) from less/vim/man in kitty windows.
map ctrl+f launch --type=background kitty-find @active-kitty-window-id

enable_audio_bell no

hide_window_decorations yes

confirm_os_window_close 0

scrollback_lines 100000
scrollback_pager history_search_pager
dim_opacity 0.4

map ctrl+t new_tab

# word-wise delete: send what zsh's emacs keymap already understands
map ctrl+backspace send_text all \x17
map ctrl+delete    send_text all \x1bd

# goto ala chrome
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
map ctrl+0 goto_tab 10

copy_on_select clipboard

cursor_trail 1
cursor_trail_start_threshold 3
cursor_trail_decay 0.1 0.2

# some additional tab styles
tab_bar_edge top
tab_bar_style slant
tab_bar_min_tabs 1
tab_title_template {index}
active_tab_title_template {index} {title}
tab_bar_align left

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="DejaVuSansM Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
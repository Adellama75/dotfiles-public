# mouse ON for wheel-scroll. Selection stays native: kitty is configured
# (mouse_map in kitty.conf) to own click-drag even when tmux grabs the mouse,
# so wheel scrolls tmux but select + middle-click-paste work without Shift.
set -g mouse on

# --- general ---
set -gq allow-passthrough on
set -g focus-events on
# Esc is passed on after 10 ms instead of tmux's default 500 ms (it waits in
# case Esc is the start of an Alt+key sequence). Makes Esc snappy in popups,
# the t menu, and claude.
set -s escape-time 10
set -g visual-activity off
set -g history-limit 500000
set -s default-terminal 'tmux-256color'
# true-colour (24-bit) passthrough tmux -> kitty, else 24-bit colours desaturate on output
set -as terminal-features ',*:RGB'
set -ga terminal-overrides ',*:Tc'
# interactive sessions run zsh (matches the laptop); login shell stays bash
set -g default-command zsh

# Push a window title to the outer terminal (kitty shows it as the tab title),
# labelled the way `t` labels sessions: "<session>  <what's running>".
#   bare shell            -> battlecode
#   program running       -> battlecode  claude      (pane_current_command)
#   program set its own   -> battlecode  ✳ Yuri Battlecode channel monitor   (#T, e.g. claude)
# #T falls back to the hostname when nothing set it, hence the #h comparison.
set -g set-titles on
set -g set-titles-string '#S#{?#{m/r:^(zsh|bash|sh|fish)$,#{pane_current_command}},,  #{?#{==:#T,#h},#{pane_current_command},#T}}'

# --- prefix: C-a ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# prefix + K : kill the current session for good (detach-and-keep is prefix + d)
bind K kill-session

# Closing a kitty window only detaches its session. Kill it if it was just an
# idle shell (nothing running), so empty sessions don't pile up. See tmux-prune.
set-hook -g client-detached 'run-shell -b "~/.local/bin/tmux-prune >/dev/null"'

# Remember which session each client is on, so a client that lost its connection
# (laptop sleep) comes back to the same one. See tmux-sticky-attach.
set-hook -g client-session-changed 'run-shell -b "[ -x ~/.local/bin/tmux-sticky-attach ] && ~/.local/bin/tmux-sticky-attach --note #{client_pid} '"'"'#{session_id}'"'"'"'
# Switching away (t) leaves the old session detached without a client-detached
# event; prune it too if it was just an idle shell.
set-hook -g 'client-session-changed[1]' 'run-shell -b "~/.local/bin/tmux-prune >/dev/null"'

# --- vi copy mode ---
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# --- start windows and panes at 1, not 0 ---
set -g base-index 1
setw -g pane-base-index 1

# --- plugins (managed by TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: also relaunch these programs when restoring. claude goes through
# claude-resurrect, which --resumes the conversation the pane was in.
set -g @resurrect-processes 'vi vim nvim emacs man less more tail top htop irssi weechat mutt ssh psql mysql sqlite3 "~python3->python3" "~ipython->ipython" "~node->node" "~claude->claude-resurrect"'

# resurrect: also capture visible pane contents + scrollback
set -g @resurrect-capture-pane-contents 'on'

# continuum: autosave every 15 min and auto-restore on tmux server start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# --- Catppuccin Mocha status bar: transparent bg so it blends into the terminal ---
set -g status-style "bg=default,fg=#8f95aa"
set -g status-left ""
set -g status-left-length 30
set -g status-right ""
set -g status-justify left
setw -g window-status-current-style "fg=#cba6f7,bold"
setw -g window-status-style "fg=#6c7086"
setw -g window-status-activity-style "fg=#f9e2af,none"
# windows unused for now — hide the window list; status-left shows the session name
setw -g window-status-format ""
setw -g window-status-current-format ""
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"

# keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'

# Alt-t: the `t` session menu as a popup over whatever is running (works inside
# claude). Cursor starts on lavender, so Alt-t Enter = detach; x kills, q closes.
bind -n M-t run-shell "tmux display-popup -c '#{client_name}' -E -w 90% -h 70% \"T_CLIENT='#{client_name}' ~/.local/bin/t\""

# prefix F: search this pane's Claude Code conversation (your messages and its
# replies, no tool output) in less, in a full-size popup.  kitty's ctrl+f
# sends this in a cumin window running claude (kitty/.config/kitty/claude-find).
bind F run-shell "tmux display-popup -c '#{client_name}' -B -E -w 100% -h 100% '~/.local/bin/claude-transcript --pane-pid #{pane_pid}'"

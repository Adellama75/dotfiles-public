# mouse ON for wheel-scroll. Selection stays native: kitty is configured
# (mouse_map in kitty.conf) to own click-drag even when tmux grabs the mouse,
# so wheel scrolls tmux but select + middle-click-paste work without Shift.
set -g mouse on

# --- general ---
set -gq allow-passthrough on
set -g focus-events on
set -g visual-activity off
set -g history-limit 500000
set -s default-terminal 'tmux-256color'
# interactive sessions run zsh (matches the laptop); login shell stays bash
set -g default-command zsh

# --- prefix: C-a ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# prefix + K : kill the current session for good (detach-and-keep is prefix + d)
bind K kill-session

# --- vi copy mode ---
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# --- start windows and panes at 1, not 0 ---
set -g base-index 1
setw -g pane-base-index 1

# --- plugins (managed by TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: also relaunch these programs when restoring
set -g @resurrect-processes 'vi vim nvim emacs man less more tail top htop irssi weechat mutt ssh psql mysql sqlite3 "~python3->python3" "~ipython->ipython" "~node->node"'

# resurrect: also capture visible pane contents + scrollback
set -g @resurrect-capture-pane-contents 'on'

# continuum: autosave every 15 min and auto-restore on tmux server start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# --- Catppuccin Mocha status bar: transparent bg so it blends into the terminal ---
set -g status-style "bg=default,fg=#8f95aa"
set -g status-left ""
set -g status-left-length 30
set -g status-right "#[fg=#a6adc8]%H:%M "
set -g status-justify left
setw -g window-status-current-style "fg=#cba6f7,bold"
setw -g window-status-style "fg=#6c7086"
setw -g window-status-activity-style "fg=#f9e2af,none"
# windows unused for now — hide the window list; status-left shows the session name
setw -g window-status-format ""
setw -g window-status-current-format ""
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"

# keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'

# Mozilla's apt Firefox execs /usr/lib/firefox/firefox-bin, so its default-browser
# check compares that path with firefox.desktop's `Exec=firefox` (/usr/bin/firefox),
# finds no match and nags on every start. Clicking "Set as default" then creates a
# stray userapp-Firefox-*.desktop. Telling it its launcher path makes the two match.
MOZ_APP_LAUNCHER=/usr/bin/firefox
